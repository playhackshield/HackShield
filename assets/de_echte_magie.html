<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Echte Magie</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #090b10;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .deck-container {
      width: 94vw;
      max-width: 1100px;
      height: 86vh;
      background: #121622;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .slide {
      display: none;
      height: calc(100% - 72px);
      flex-direction: column;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.35s ease-out;
    }

    .slide.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Beeldvlak */
    .image-frame {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #0b0e17;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.85);
    }

    .image-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(18, 22, 34, 0.05) 50%, rgba(18, 22, 34, 0.95) 100%);
    }

    /* Titelbalk onder het beeld */
    .title-banner {
      padding: 22px 32px 28px;
      background: #121622;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .headline {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .headline .emoji {
      font-size: 3rem;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
    }

    /* Navigatiebalk */
    .footer-bar {
      height: 72px;
      background: #0b0e17;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      z-index: 10;
    }

    .nav-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .nav-btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: #4b5563;
      cursor: not-allowed;
      transform: none;
    }

    .slide-dots {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .dot.active {
      background: #38bdf8;
      width: 26px;
      border-radius: 999px;
    }

    @media (max-width: 768px) {
      .headline {
        font-size: 1.8rem;
        gap: 10px;
      }
      .headline .emoji {
        font-size: 2rem;
      }
      .footer-bar {
        padding: 0 16px;
      }
    }
  </style>
</head>
<body>

  <div class="deck-container">

    <!-- Slide 1: Het Geheim -->
    <section class="slide active">
      <div class="image-frame">
        <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=1200&q=80" alt="Zonnestralen door bomen">
      </div>
      <div class="title-banner">
        <h1 class="headline"><span class="emoji">🤫</span> HET GEHEIM <span class="emoji">✨</span></h1>
      </div>
    </section>

    <!-- Slide 2: De Race om Cool -->
    <section class="slide">
      <div class="image-frame">
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=80" alt="Gaming en felle neon lichten">
      </div>
      <div class="title-banner">
        <h2 class="headline"><span class="emoji">🎮</span> DE RACE OM COOL <span class="emoji">🕶️</span></h2>
      </div>
    </section>

    <!-- Slide 3: Alleen Bovenop -->
    <section class="slide">
      <div class="image-frame">
        <img src="https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=1200&q=80" alt="Eenzame toren of hoge bergkam">
      </div>
      <div class="title-banner">
        <h2 class="headline"><span class="emoji">🏰</span> ALLEEN BOVENOP <span class="emoji">🧊</span></h2>
      </div>
    </section>

    <!-- Slide 4: Angst -->
    <section class="slide">
      <div class="image-frame">
        <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1200&q=80" alt="Duister onweer en bliksemflits">
      </div>
      <div class="title-banner">
        <h2 class="headline"><span class="emoji">⚡</span> ANGST <span class="emoji">🚨</span></h2>
      </div>
    </section>

    <!-- Slide 5: Adem & Ontspan -->
    <section class="slide">
      <div class="image-frame">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80" alt="Rustig water en vredige natuur">
      </div>
      <div class="title-banner">
        <h2 class="headline"><span class="emoji">🍃</span> ADEM &amp; ONTSPAN <span class="emoji">🌊</span></h2>
      </div>
    </section>

    <!-- Slide 6: De Echte Magie -->
    <section class="slide">
      <div class="image-frame">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80" alt="Warm gloeiend vuur en magisch licht">
      </div>
      <div class="title-banner">
        <h2 class="headline"><span class="emoji">🔮</span> DE ECHTE MAGIE <span class="emoji">🌟</span></h2>
      </div>
    </section>

    <!-- Slide 7: Compassie & Kracht -->
    <section class="slide">
      <div class="image-frame">
        <img src="https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?auto=format&fit=crop&w=1200&q=80" alt="Twee helpende handen">
      </div>
      <div class="title-banner">
        <h2 class="headline"><span class="emoji">💖</span> COMPASSIE &amp; KRACHT <span class="emoji">🤝</span></h2>
      </div>
    </section>

    <!-- Slide 8: Jouw Kracht -->
    <section class="slide">
      <div class="image-frame">
        <img src="https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?auto=format&fit=crop&w=1200&q=80" alt="Weidse gouden horizon">
      </div>
      <div class="title-banner">
        <h2 class="headline"><span class="emoji">🌅</span> JOUW KRACHT <span class="emoji">🚀</span></h2>
      </div>
    </section>

    <!-- Navigatiebalk -->
    <footer class="footer-bar">
      <button class="nav-btn" id="prevBtn" disabled>◀ Vorige</button>
      <div class="slide-dots" id="dotsContainer"></div>
      <button class="nav-btn" id="nextBtn">Volgende ▶</button>
    </footer>

  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('dotsContainer');
    let currentSlide = 0;

    slides.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (idx === 0) dot.classList.add('active');
      dot.addEventListener('click', () => showSlide(idx));
      dotsContainer.appendChild(dot);
    });

    const dots = document.querySelectorAll('.dot');

    function showSlide(index) {
      slides[currentSlide].classList.remove('active');
      dots[currentSlide].classList.remove('active');

      currentSlide = index;

      slides[currentSlide].classList.add('active');
      dots[currentSlide].classList.add('active');

      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === slides.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentSlide > 0) showSlide(currentSlide - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (currentSlide < slides.length - 1) showSlide(currentSlide + 1);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        if (currentSlide < slides.length - 1) {
          e.preventDefault();
          showSlide(currentSlide + 1);
        }
      } else if (e.key === 'ArrowLeft') {
        if (currentSlide > 0) {
          e.preventDefault();
          showSlide(currentSlide - 1);
        }
      }
    });
  </script>
</body>
</html>
