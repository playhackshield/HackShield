<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Agent Paspoort — Digitaal Bladerboek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070d24;
      --bg-navy: #0e1842;
      --card-navy: #14225c;
      --accent-cyan: #00e5ff;
      --accent-blue: #3b82f6;
      --accent-gold: #fbbf24;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --page-ratio: 0.707; /* A-formaat verhouding (1 : sqrt(2)) */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 20%, #152669 0%, var(--bg-dark) 75%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Subtiel cyber-raster op de achtergrond */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(0, 229, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 14px rgba(0, 229, 255, 0.25);
    }

    /* 3D Boek Container */
    main {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1120px;
      padding: 8px 0;
    }

    .book-stage {
      position: relative;
      /* Responsive afmetingen zodat een dubbele pagina altijd past */
      width: min(92vw, 920px);
      height: min(66vh, calc(min(92vw, 920px) * 0.707));
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2200px;
    }

    /* Het volledige boek (2 helften naast elkaar in open stand) */
    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* Centreer de voorkant (cover) of achterkant wanneer het boek dicht is */
    .book.is-cover {
      transform: translateX(-25%);
    }

    .book.is-back {
      transform: translateX(25%);
    }

    /* Eén dubbelzijdig blad (Sheet) dat om de rug (left: 50%) scharniert */
    .sheet {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
    }

    .sheet.flipped {
      transform: rotateY(-180deg);
    }

    /* Voor- en achterzijde van een blad */
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-color: #ffffff;
      border-radius: 4px 14px 14px 4px;
      overflow: hidden;
      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.48),
        inset 0 0 0 1px rgba(22, 29, 74, 0.15);
      display: flex;
      flex-direction: column;
    }

    .face.back {
      transform: rotateY(180deg);
      border-radius: 14px 4px 4px 14px;
    }

    /* Realistische boekrug-schaduw en vouwlijn */
    .face.front::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 28px;
      background: linear-gradient(to right, rgba(7, 13, 36, 0.22), rgba(7, 13, 36, 0.04) 55%, transparent);
      pointer-events: none;
      z-index: 3;
    }

    .face.back::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 28px;
      background: linear-gradient(to left, rgba(7, 13, 36, 0.22), rgba(7, 13, 36, 0.04) 55%, transparent);
      pointer-events: none;
      z-index: 3;
    }

    /* Glans/schaduw animatie tijdens het omslaan */
    .turn-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 4;
    }

    .sheet.turning .turn-glare {
      opacity: 1;
    }

    /* De paspoort afbeelding */
    .face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
      display: block;
    }

    /* Fallback kaart als de lokale JPG nog niet gevonden is */
    .fallback-page {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      margin: 10px;
      border: 3px solid #161d4a;
      border-radius: 12px;
      background: #f8fafc;
      color: #161d4a;
      text-align: center;
    }

    .face.img-missing img {
      display: none;
    }

    .face.img-missing .fallback-page {
      display: flex;
    }

    .fallback-header {
      font-weight: 800;
      font-size: clamp(0.95rem, 1.8vw, 1.3rem);
      color: #161d4a;
    }

    .fallback-sub {
      font-size: clamp(0.72rem, 1.2vw, 0.88rem);
      color: #475569;
      margin-top: 4px;
    }

    .fallback-box {
      flex: 1;
      margin: 12px 0;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      gap: 6px;
    }

    .fallback-file {
      font-family: monospace;
      font-size: 0.72rem;
      background: #e2e8f0;
      color: #0f172a;
      padding: 4px 8px;
      border-radius: 6px;
      word-break: break-all;
    }

    .fallback-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #161d4a;
    }

    /* Bedieningsbalk onderaan */
    footer.controls {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(14, 24, 66, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 229, 255, 0.25);
      padding: 10px 20px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-top: 10px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
      color: #ffffff;
      border: 1px solid rgba(0, 229, 255, 0.45);
      border-radius: 12px;
      padding: 11px 20px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }

    .nav-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.45);
    }

    .nav-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .nav-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-pill {
      min-width: 175px;
      text-align: center;
      padding: 8px 14px;
      background: rgba(7, 13, 36, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
    }

    .status-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .status-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Pagina-bolletjes (dots) */
    .dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      padding: 0;
    }

    .dot.active {
      width: 22px;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    /* Mobiele weergave: 1 pagina tegelijk zodat het groot en leesbaar blijft */
    @media (max-width: 680px) {
      .book-stage {
        width: min(88vw, 380px);
        height: min(62vh, calc(min(88vw, 380px) * 1.414));
      }

      .book.is-cover,
      .book.is-back {
        transform: none;
      }

      .sheet {
        left: 0;
        width: 100%;
      }

      .face,
      .face.back {
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      HackShield Introductieles
    </div>
    <h1>Cyber Agent Paspoort</h1>
  </header>

  <main>
    <div class="book-stage" id="bookStage">
      <div class="book is-cover" id="book">
        <!-- De 4 dubbelzijdige vellen (8 bladzijden) worden hier via JavaScript opgebouwd -->
      </div>
    </div>
  </main>

  <footer class="controls">
    <button type="button" class="nav-btn" id="prevBtn" aria-label="Vorige pagina">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Vorige
    </button>

    <div class="status-pill">
      <div class="status-title" id="pageIndicator">Pagina 1 van 8</div>
      <div class="status-hint">Klik op een pagina of gebruik ← →</div>
    </div>

    <div class="dots" id="dotsContainer" aria-label="Pagina navigatie"></div>

    <button type="button" class="nav-btn" id="nextBtn" aria-label="Volgende pagina">
      Volgende
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </footer>

  <script>
    /**
     * Configuratie van de 8 pagina's van het Cyber Agent Paspoort.
     * Bestandsnamen komen exact overeen met 'Cyber Agent paspoort (1).jpg' t/m '(8).jpg'.
     */
    const PAGES = [
      {
        num: 1,
        file: "Cyber Agent paspoort (1).jpg",
        title: "Cyber Agent Paspoort",
        subtitle: "Naam & Avatar (Voorkant)"
      },
      {
        num: 2,
        file: "Cyber Agent paspoort (2).jpg",
        title: "Wie wil jij beschermen?",
        subtitle: "Teken de mensen en dieren die je belangrijk vindt"
      },
      {
        num: 3,
        file: "Cyber Agent paspoort (3).jpg",
        title: "Robot voor in huis",
        subtitle: "Teken een robot die alles voor je kan doen"
      },
      {
        num: 4,
        file: "Cyber Agent paspoort (4).jpg",
        title: "Leuke games",
        subtitle: "Teken de games die je speelt of graag wilt spelen"
      },
      {
        num: 5,
        file: "Cyber Agent paspoort (5).jpg",
        title: "Boeven oppakken",
        subtitle: "Teken hoe wij alle slechteriken de baas zijn"
      },
      {
        num: 6,
        file: "Cyber Agent paspoort (6).jpg",
        title: "Vrienden online",
        subtitle: "Teken hoe jij en je vrienden online plezier maken"
      },
      {
        num: 7,
        file: "Cyber Agent paspoort (7).jpg",
        title: "Vrij tekenen!",
        subtitle: "Hier mag je zelf iets cyber-achtigs tekenen"
      },
      {
        num: 8,
        file: "Cyber Agent paspoort (8).jpg",
        title: "Cyber Agent Notities & Tekeningen",
        subtitle: "Gecertificeerd Cyber Agent (Achterkant)"
      }
    ];

    const bookEl = document.getElementById("book");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageIndicator = document.getElementById("pageIndicator");
    const dotsContainer = document.getElementById("dotsContainer");

    // 4 vellen (sheets) met elk 2 zijden = 8 pagina's
    const totalSheets = PAGES.length / 2;
    let currentSheet = 0; // 0 = voorkant (pag 1), 1 = pag 2-3, 2 = pag 4-5, 3 = pag 6-7, 4 = achterkant (pag 8)
    let isMobileMode = window.innerWidth <= 680;
    let mobilePageIndex = 0; // 0..7 voor smalle schermen

    /**
     * Maakt de HTML voor één zijde van een blad inclusief automatische fallback
     */
    function createPageFace(pageData, sideClass) {
      const face = document.createElement("div");
      face.className = `face ${sideClass}`;

      const img = document.createElement("img");
      img.src = encodeURI(pageData.file);
      img.alt = `Pagina ${pageData.num}: ${pageData.title}`;
      img.draggable = false;

      // Als de afbeelding lokaal nog niet aanwezig is, toon een nette kaart-preview
      img.onerror = () => {
        face.classList.add("img-missing");
      };

      const fallback = document.createElement("div");
      fallback.className = "fallback-page";
      fallback.innerHTML = `
        <div>
          <div class="fallback-header">${pageData.title}</div>
          <div class="fallback-sub">${pageData.subtitle}</div>
        </div>
        <div class="fallback-box">
          <span style="font-size: 0.78rem; color: #64748b;">Afbeelding nog niet in map gevonden:</span>
          <span class="fallback-file">${pageData.file}</span>
        </div>
        <div class="fallback-footer">
          <span>HackShield</span>
          <span>Pagina ${pageData.num} / 8</span>
        </div>
      `;

      const glare = document.createElement("div");
      glare.className = "turn-glare";

      face.appendChild(img);
      face.appendChild(fallback);
      face.appendChild(glare);
      return face;
    }

    /**
     * Bouwt de 4 dubbelzijdige bladen op in de DOM
     */
    const sheetElements = [];
    for (let i = 0; i < totalSheets; i++) {
      const sheet = document.createElement("div");
      sheet.className = "sheet";
      sheet.dataset.index = i;
      sheet.style.zIndex = totalSheets - i;

      const frontPage = PAGES[i * 2];
      const backPage = PAGES[i * 2 + 1];

      const frontFace = createPageFace(frontPage, "front");
      const backFace = createPageFace(backPage, "back");

      // Klik op de rechterpagina -> volgende, klik op linkerpagina -> vorige
      frontFace.addEventListener("click", () => {
        if (!isMobileMode) {
          goNext();
        } else {
          goNext();
        }
      });

      backFace.addEventListener("click", () => {
        if (!isMobileMode) {
          goPrev();
        } else {
          goNext();
        }
      });

      sheet.appendChild(frontFace);
      sheet.appendChild(backFace);
      bookEl.appendChild(sheet);
      sheetElements.push(sheet);
    }

    /**
     * Bouwt de navigatie-bolletjes onderaan op
     */
    function buildDots() {
      dotsContainer.innerHTML = "";
      const count = isMobileMode ? PAGES.length : totalSheets + 1;
      for (let i = 0; i < count; i++) {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "dot";
        dot.ariaLabel = isMobileMode ? `Ga naar pagina ${i + 1}` : `Ga naar stand ${i + 1}`;
        dot.addEventListener("click", () => {
          if (isMobileMode) {
            mobilePageIndex = i;
            updateBookView();
          } else {
            jumpToSheet(i);
          }
        });
        dotsContainer.appendChild(dot);
      }
    }

    /**
     * Werkt de 3D-rotatie, z-indexen, knoppen en teller bij
     */
    function updateBookView() {
      isMobileMode = window.innerWidth <= 680;

      if (isMobileMode) {
        // Mobiel: toon 1 pagina tegelijk met nette 3D-overgang
        bookEl.classList.remove("is-cover", "is-back");
        const targetSheet = Math.floor(mobilePageIndex / 2);
        const showBack = mobilePageIndex % 2 === 1;

        sheetElements.forEach((sheet, idx) => {
          sheet.style.display = idx === targetSheet ? "block" : "none";
          sheet.style.zIndex = idx === targetSheet ? 10 : 1;
          if (idx === targetSheet) {
            if (showBack) {
              sheet.classList.add("flipped");
            } else {
              sheet.classList.remove("flipped");
            }
          }
        });

        pageIndicator.textContent = `Pagina ${mobilePageIndex + 1} van ${PAGES.length}`;
        prevBtn.disabled = mobilePageIndex === 0;
        nextBtn.disabled = mobilePageIndex === PAGES.length - 1;

        Array.from(dotsContainer.children).forEach((dot, idx) => {
          dot.classList.toggle("active", idx === mobilePageIndex);
        });
        return;
      }

      // Desktop / Tablet: echt 2-pagina bladerboek
      sheetElements.forEach((sheet, idx) => {
        sheet.style.display = "block";
        if (idx < currentSheet) {
          sheet.classList.add("flipped");
          sheet.style.zIndex = idx + 1;
        } else {
          sheet.classList.remove("flipped");
          sheet.style.zIndex = totalSheets - idx;
        }
      });

      // Centreer het gesloten boek netjes op het scherm
      bookEl.classList.toggle("is-cover", currentSheet === 0);
      bookEl.classList.toggle("is-back", currentSheet === totalSheets);

      // Update tekstuele pagina-indicator
      if (currentSheet === 0) {
        pageIndicator.textContent = "Pagina 1 van 8 (Voorkant)";
      } else if (currentSheet === totalSheets) {
        pageIndicator.textContent = "Pagina 8 van 8 (Achterkant)";
      } else {
        const leftNum = currentSheet * 2;
        const rightNum = currentSheet * 2 + 1;
        pageIndicator.textContent = `Pagina ${leftNum} – ${rightNum} van 8`;
      }

      prevBtn.disabled = currentSheet === 0;
      nextBtn.disabled = currentSheet === totalSheets;

      Array.from(dotsContainer.children).forEach((dot, idx) => {
        dot.classList.toggle("active", idx === currentSheet);
      });
    }

    function triggerGlare(sheet) {
      if (!sheet) return;
      sheet.classList.add("turning");
      setTimeout(() => sheet.classList.remove("turning"), 550);
    }

    function goNext() {
      if (isMobileMode) {
        if (mobilePageIndex < PAGES.length - 1) {
          mobilePageIndex++;
          triggerGlare(sheetElements[Math.floor(mobilePageIndex / 2)]);
          updateBookView();
        }
        return;
      }

      if (currentSheet < totalSheets) {
        triggerGlare(sheetElements[currentSheet]);
        currentSheet++;
        updateBookView();
      }
    }

    function goPrev() {
      if (isMobileMode) {
        if (mobilePageIndex > 0) {
          mobilePageIndex--;
          triggerGlare(sheetElements[Math.floor(mobilePageIndex / 2)]);
          updateBookView();
        }
        return;
      }

      if (currentSheet > 0) {
        currentSheet--;
        triggerGlare(sheetElements[currentSheet]);
        updateBookView();
      }
    }

    function jumpToSheet(target) {
      if (target === currentSheet) return;
      const movingIdx = target > currentSheet ? currentSheet : target;
      triggerGlare(sheetElements[movingIdx]);
      currentSheet = target;
      updateBookView();
    }

    // Knoppen & toetsenbord
    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") {
        goNext();
      } else if (e.key === "ArrowLeft") {
        goPrev();
      }
    });

    // Swipe-ondersteuning op touchscreens
    let touchStartX = 0;
    const stageEl = document.getElementById("bookStage");
    stageEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    stageEl.addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 45) {
        if (diff < 0) goNext();
        else goPrev();
      }
    }, { passive: true });

    window.addEventListener("resize", () => {
      const nowMobile = window.innerWidth <= 680;
      if (nowMobile !== isMobileMode) {
        isMobileMode = nowMobile;
        buildDots();
      }
      updateBookView();
    });

    // Start
    buildDots();
    updateBookView();
  </script>
</body>
</html>
