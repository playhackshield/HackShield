<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassenquests</title>
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        /* Header styling */
        header {
            text-align: center;
            padding: 20px 0;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Main content */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        /* Cards container with horizontal scrolling */
        .cards-container {
            width: 100%;
            overflow-x: auto;
            padding: 15px 0 25px;
            scrollbar-width: thin;
            scrollbar-color: #3498db #f0f0f0;
        }
        
        .cards-container::-webkit-scrollbar {
            height: 8px;
        }
        
        .cards-container::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 4px;
        }
        
        .cards-container::-webkit-scrollbar-thumb {
            background-color: #3498db;
            border-radius: 4px;
        }
        
        .cards-scroll {
            display: flex;
            gap: 25px;
            padding: 10px 5px;
            min-width: min-content;
        }
        
        /* Individual cards */
        .quest-card {
            flex: 0 0 280px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid #eaeaea;
        }
        
        .quest-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.12);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .card-title {
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .card-image {
            width: 100%;
            height: 140px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            overflow: hidden;
        }
        
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-description {
            color: #5d6d7e;
            font-size: 0.95rem;
            line-height: 1.5;
        }
                
        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .quest-card {
                flex: 0 0 260px;
            }
            
            .container {
                padding: 10px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .quest-card {
                flex: 0 0 240px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>KLASSENQUESTS</h1>
        </header>
        
        <main class="main-content">
            <section class="cards-container">
                <div class="cards-scroll" id="cards-container">
                    <!-- Cards will be generated by JavaScript from JSON -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // JSON data for the cards
        const questsData = [
            {
                "id": 'talentenfontein',
                "title": "De Talentenfontein",
                "image": "assets/talentenfontein/selector.jpg",
                "description": "Ontdek in deze quest jouw unieke set aan talenten."
            },
            {
                "id": 'filterfabriek',
                "title": "De Filterfabriek",
                "image": "assets/filterfabriek/selector.jpg",
                "description": "Leer hier hoe jij echt van nep blijft zien in de digitale wereld."
            }
        ];

        // Function to create a card element
        function createCardElement(quest) {
            return `
                <div class="quest-card" data-id="${quest.id}">
                    <div class="card-header">
                        <h3 class="card-title">${quest.title}</h3>
                    </div>
                    <div class="card-image">
                        <img src="${quest.image}" alt="${quest.title}">
                    </div>
                    <p class="card-description">${quest.description}</p>
                </div>
            `;
        }

        // Function to render all cards
        function renderCards() {
            const cardsContainer = document.getElementById('cards-container');
            cardsContainer.innerHTML = '';
            
            questsData.forEach(quest => {
                const cardElement = createCardElement(quest);
                cardsContainer.innerHTML += cardElement;
            });
            
            // Add click event listeners to cards
            document.querySelectorAll('.quest-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    // Navigeer naar selector.html met de ID als query parameter
                    window.location.href = `selector.html?id=${id}`;
                });
            });
        }

        // Function to animate progress bar
        function animateProgressBar() {
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            
            // Simulate progress after a delay
            setTimeout(() => {
                progressFill.style.width = '100%';
                progressText.textContent = '1/1';
            }, 500);
        }

        // Initialize the page when loaded
        document.addEventListener('DOMContentLoaded', function() {
            renderCards();
            animateProgressBar();
            
            // Add some example interaction for the cards
            console.log("Pagina geladen! Gebruik horizontaal scrollen om alle quests te zien.");
            console.log("Je kunt de JSON-data aanpassen in het script om nieuwe quests toe te voegen.");
        });
    </script>
</body>
</html>
