<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratis AI Afbeelding Generator</title>
    
    <!-- We laden Puter.js in het hoofd van de pagina -->
    <script src="https://js.puter.com/v2/"></script>
    
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; }
        #resultaat { margin-top: 20px; min-height: 300px; display: flex; align-items: center; justify-content: center; border: 2px dashed #ccc; }
        img { max-width: 100%; height: auto; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Gratis AI Afbeelding Generator</h1>
    <p>Gangedreven door Puter.js</p>

    <input type="text" id="promptInput" value="A cute cat astronaut, digital art" placeholder="Omschrijf je afbeelding...">
    <br>
    <button id="genereerKnop" onclick="genereerAfbeelding()">✨ Genereer</button>

    <div id="resultaat">
        <p id="statusTekst">Je afbeelding verschijnt hier...</p>
    </div>

    <script>
        async function genereerAfbeelding() {
            // Controleer EERST of het 'puter' object wel bestaat
            if (typeof puter === 'undefined') {
                alert("Fout: Puter.js kon niet worden geladen. Controleer je internetverbinding of schakel eventuele adblockers/privacy-extensions uit voor deze pagina.");
                return;
            }

            const prompt = document.getElementById('promptInput').value;
            const knop = document.getElementById('genereerKnop');
            const resultaatDiv = document.getElementById('resultaat');

            if (!prompt) return alert('Vul een omschrijving in!');

            knop.disabled = true;
            knop.innerText = "Laden...";
            resultaatDiv.innerHTML = '<p>AI genereert de afbeelding (dit duurt ca. 5-10 seconden)...</p>';

            try {
                // Officiële API-aanroep naar Puter
                const image = await puter.ai.txt2img(prompt);
                
                resultaatDiv.innerHTML = '';
                resultaatDiv.appendChild(image);
            } catch (error) {
                console.error("Puter Error:", error);
                resultaatDiv.innerHTML = '<p style="color:red;">Er ging iets mis bij het genereren. Open de console (F12) voor details.</p>';
            } finally {
                knop.disabled = false;
                knop.innerText = "✨ Genereer";
            }
        }
    </script>

</body>
</html>
